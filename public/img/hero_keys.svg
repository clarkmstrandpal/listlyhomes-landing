<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E57FF"/><stop offset="1" stop-color="#14C6F1"/></linearGradient></defs>
  <rect width="640" height="420" rx="24" fill="url(#g)"/>
  <circle cx="160" cy="210" r="70" fill="#fff" opacity="0.25"/>
  <rect x="260" y="160" width="300" height="100" rx="12" fill="#fff" opacity="0.9"/>
  <circle cx="300" cy="210" r="12" fill="#0E57FF"/>
</svg>
'

# ---------- Ensure index.html title says Listly Homes ----------
$idx = Join-Path $root "index.html"
if(Test-Path $idx){
  $t = Get-Content $idx -Raw
  $t = $t -replace '<title>BuyerBoard</title>','<title>Listly Homes</title>'
  $t = $t -replace '>BuyerBoard<','>Listly Homes<'
  Set-Content -Encoding UTF8 -Path $idx -Value $t
}

# ---------- Build + Deploy ----------
Push-Location $root
npm run build
Pop-Location
aws s3 sync "$root\dist" "s3://$bucket" --delete --cache-control "public, max-age=300"
aws s3 website "s3://$bucket" --index-document index.html --error-document index.html
Write-Host "Listly Homes landing restored + deployed." -ForegroundColor Green
